name: TEMPORAL - Radar (nueva corrida tras ajustar palabras clave)

# Corrida única autorizada por Seba el 26-11-2026: vuelve a llenar el radar con
# las palabras clave ajustadas. Corre al hacer push a la rama de Claude. Se borra después.
on:
  push:
    branches: [claude/gracious-cray-bpmg45]
    paths: [.github/workflows/radar_carga_temporal.yml]

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MP_TICKET:    ${{ secrets.MP_TICKET }}
        run: python -u radar_oportunidades.py

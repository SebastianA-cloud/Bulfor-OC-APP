name: TEMPORAL - Carga de observaciones de las OC

# Carga única autorizada por Seba el 27-11-2026 (respaldo previo:
# ordenes_compra_backup_20261127). Corre al hacer push a la rama de Claude:
# guarda las observaciones de las OC antiguas. Se borra después.
on:
  push:
    branches: [claude/gracious-cray-bpmg45]
    paths: [.github/workflows/carga_observaciones_temporal.yml]

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MP_TICKET:    ${{ secrets.MP_TICKET }}
        run: python -u actualizar_oc_final.py --observaciones

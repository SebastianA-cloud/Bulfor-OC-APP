name: TEMPORAL - Actualizar competencia (últimos 3 meses)

# Corrida única a pedido de Seba (26-11-2026, paso 1 de la competencia): pone al
# día lic_lineas / lic_ofertas con los últimos 3 meses de Datos Abiertos (solo
# upsert, no borra). Corre al hacer push a la rama de Claude. Se borra después.
on:
  push:
    branches: [claude/gracious-cray-bpmg45]
    paths: [.github/workflows/competencia_carga_temporal.yml]

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase pandas
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -u competencia_licitaciones.py --supabase --meses-recientes 3

name: Sincronizar facturas recibidas (por pagar)

on:
  schedule:
    - cron: '50 */2 * * *'  # cada 2 horas, 50 min después de las OC
  workflow_dispatch:  # permite ejecutarlo manualmente con un botón
    inputs:
      historico_completo:
        description: 'Traer TODO desde 2024 (ignora lo ya guardado) — úsalo solo puntualmente'
        type: boolean
        default: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests supabase

      - name: Ejecutar sincronización
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DTEBOX_IP: ${{ secrets.DTEBOX_IP }}
          GDEXPRESS_API_KEY: ${{ secrets.GDEXPRESS_API_KEY }}
          FORZAR_HISTORICO_COMPLETO: ${{ github.event.inputs.historico_completo || 'false' }}
        run: python sincronizar_facturas_recibidas.py

name: Sincronizar facturas desde GDExpress

on:
  schedule:
    - cron: '20 */2 * * *'  # cada 2 horas, 20 min después de las OC (antes: solo 3:15am hora Chile)
  workflow_dispatch:  # permite ejecutarlo manualmente con un botón

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests supabase

      - name: Ejecutar sincronización
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}  # clave de administrador: se salta las reglas de seguridad, para que el robot pueda escribir
          DTEBOX_IP: ${{ secrets.DTEBOX_IP }}
          GDEXPRESS_API_KEY: ${{ secrets.GDEXPRESS_API_KEY }}
        run: python sincronizar_gdexpress.py

name: Radar de oportunidades (licitaciones y compras ágiles)

# Busca licitaciones y compras ágiles abiertas en todo Chile que calcen con lo
# que vende Bulfor y las guarda en mp_oportunidades (se ven en la app, en
# Órdenes de compra › Oportunidades). Solo lee de Mercado Público.
on:
  schedule:
    - cron: '10 */2 * * *'  # cada 2 horas, a los :10 (la de OC corre a los :00)
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests supabase
      - name: Buscar oportunidades
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}  # clave de administrador: solo en GitHub Secrets
          MP_TICKET:    ${{ secrets.MP_TICKET }}
        run: python radar_oportunidades.py

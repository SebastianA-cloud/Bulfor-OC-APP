name: TEMPORAL - Carga inicial radar y contactos de OC

# Carga única autorizada por Seba el 26-11-2026. Corre al hacer push a la rama
# de Claude: llena el radar por primera vez y completa contacto y estado de las
# OC antiguas (respaldo previo: ordenes_compra_backup_20261126). Se borra después.
on:
  push:
    branches: [claude/gracious-cray-bpmg45]
    paths: [.github/workflows/carga_inicial_oportunidades.yml]

jobs:
  cargar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase
      - name: Radar (primera corrida)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MP_TICKET:    ${{ secrets.MP_TICKET }}
        run: python radar_oportunidades.py
      - name: Contacto y estado de las OC antiguas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MP_TICKET:    ${{ secrets.MP_TICKET }}
        run: python actualizar_oc_final.py --rellenar
